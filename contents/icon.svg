<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62c5ec"/>
      <stop offset="1" stop-color="#1982bd"/>
    </linearGradient>
    <linearGradient id="tile-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#dce9f1"/>
    </linearGradient>
    <radialGradient id="ball" cx=".32" cy=".22" r=".82">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".7" stop-color="#f3f6f8"/>
      <stop offset="1" stop-color="#bdcbd4"/>
    </radialGradient>
  </defs>

  <!-- Rounded blue tile with a subtle lower edge, matching Breeze app-icon depth. -->
  <rect x="5" y="5" width="40" height="40" rx="10" fill="#102b3c" opacity=".20"/>
  <rect x="4" y="4" width="40" height="40" rx="10" fill="url(#tile)" stroke="#126a9d" stroke-width="1"/>
  <path d="M5 14a9 9 0 0 1 9-9h20a9 9 0 0 1 9 9v3H5z" fill="url(#tile-gloss)"/>

  <!-- Small standings card behind the ball: rows, position markers, and score lines. -->
  <rect x="9.5" y="12.5" width="20" height="25" rx="3" fill="#102b3c" opacity=".22"/>
  <rect x="8.5" y="11.5" width="20" height="25" rx="3" fill="url(#card)" stroke="#8298a8" stroke-width=".8"/>
  <path d="M11.5 15h14" stroke="#5c7587" stroke-linecap="round" stroke-width="1.2"/>
  <circle cx="12.5" cy="20" r="1.5" fill="#2d9bd0"/>
  <path d="M16 20h8" stroke="#718797" stroke-linecap="round" stroke-width="1.4"/>
  <circle cx="12.5" cy="25.5" r="1.5" fill="#38a66b"/>
  <path d="M16 25.5h6.5" stroke="#718797" stroke-linecap="round" stroke-width="1.4"/>
  <circle cx="12.5" cy="31" r="1.5" fill="#7f96a5"/>
  <path d="M16 31h8" stroke="#718797" stroke-linecap="round" stroke-width="1.4"/>

  <!-- Football foreground, with a soft lower-right shadow and clear panel seams. -->
  <circle cx="31.5" cy="29.5" r="12" fill="#102b3c" opacity=".25"/>
  <circle cx="30.5" cy="28.5" r="12" fill="url(#ball)" stroke="#344654" stroke-width="1.2"/>
  <path d="m30.5 21.5 4.4 3.2-1.7 5.2h-5.4l-1.7-5.2z" fill="#344654"/>
  <g fill="none" stroke="#344654" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25">
    <path d="m26.1 24.7-3.7-1.2m5.4-2-1.2-3.1m8.3 6.3 3.4-1.1m-5.1 8.3 1.1 3.5m-7.2-3.5-1.3 3.4m-1.2-9.4-3.1.7m6.6 3.7-.7 4.7m5.4-7.8 3 1.8"/>
  </g>
  <path d="M20.3 34.2a12 12 0 0 0 4.4 4.8" fill="none" stroke="#a8def1" stroke-linecap="round" stroke-width="1.4"/>
</svg>
