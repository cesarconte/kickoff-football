name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # The glob is quoted so that Node resolves it itself. Passing a bare
      # directory (`node --test tests/`) is not supported on Node 22 and 24.
      - name: Run tests
        run: node --test "tests/**/*.test.js"

  package:
    name: Package and translation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # gettext ships with the runner image, but make sure of it.
      - name: Ensure gettext is available
        run: command -v msgfmt || (sudo apt-get update && sudo apt-get install -y gettext)

      - name: Validate the plasmoid package
        run: node scripts/check-package.js

      - name: Verify the Spanish translation
        run: scripts/check-i18n.sh
